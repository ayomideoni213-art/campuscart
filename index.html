<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusMart - Student Marketplace & Entrepreneurship Platform</title>
    <meta name="description" content="A modern campus e-commerce marketplace and entrepreneurship hub where university students buy, sell, build brands, and launch student businesses." />
    <meta property="og:title" content="CampusMart - Student Marketplace & Entrepreneurship Platform" />
    <meta property="og:description" content="A modern campus e-commerce marketplace and entrepreneurship hub where university students buy, sell, build brands, and launch student businesses." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Cabinet+Grotesk:wght@500;700;800;900&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('campusmart_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || (!stored && prefersDark) || (stored === 'system' && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-stone-50 text-stone-900 dark:bg-[#0c0e12] dark:text-[#f2f4f8] antialiased selection:bg-amber-400 selection:text-stone-950 transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
